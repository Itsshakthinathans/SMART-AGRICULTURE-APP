<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriTech Pro - Smart Agriculture</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>AgriTech Pro</h1>
    <p>Kaggle-trained Crop Recommendation + Plant Disease Detection + Advisory</p>
    <div class="hero-actions">
      <button id="checkHealthBtn">Check Backend Health</button>
      <button id="retrainBtn">Retrain Models</button>
    </div>
    <pre id="healthBox">Click "Check Backend Health" to inspect model readiness.</pre>
  </header>

  <main class="container">
    <section class="card">
      <h2>🌾 Crop Recommendation</h2>
      <form id="cropForm" class="grid-2">
        <input type="number" step="any" name="nitrogen" placeholder="Nitrogen (N)" required />
        <input type="number" step="any" name="phosphorus" placeholder="Phosphorus (P)" required />
        <input type="number" step="any" name="potassium" placeholder="Potassium (K)" required />
        <input type="number" step="any" name="temperature" placeholder="Temperature (°C)" required />
        <input type="number" step="any" name="humidity" placeholder="Humidity (%)" required />
        <input type="number" step="any" name="ph" placeholder="Soil pH" required />
        <input type="number" step="any" name="rainfall" placeholder="Rainfall (mm)" required />
        <button type="button" id="weatherFillBtn">Auto-fill Weather (Location)</button>
        <button type="submit">Recommend Crop</button>
      </form>
      <div id="cropResult" class="result"></div>
    </section>

    <section class="card">
      <h2>🍃 Disease Detection</h2>
      <form id="diseaseForm" class="stack">
        <input type="file" id="leafImage" accept="image/*" required />
        <button type="submit">Detect Disease</button>
      </form>
      <div id="diseaseResult" class="result"></div>
    </section>

    <section class="card full">
      <h2>📊 Model Info</h2>
      <button id="loadModelInfoBtn">Load Model Info</button>
      <pre id="modelInfoBox">No data loaded yet.</pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
